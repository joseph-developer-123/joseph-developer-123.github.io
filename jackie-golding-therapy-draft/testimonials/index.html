<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Testimonials | Jackie Golding Therapy</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        /* SHARED SITE VARIABLES & CSS */
        :root { --bg-main: #fdfcfb; --bg-quote: #faebe2; --box-peach-dark: #f8cbad; --box-pink: #f4d0d6; --box-peach-light: #fce2ce; --text-dark: #333333; --text-gray: #666666; --font-main: 'Urbanist', sans-serif; --max-width: 1100px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); color: var(--text-dark); background-color: var(--bg-main); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 20px; }
        h1 { text-align: center; font-size: 2.5rem; font-weight: 300; letter-spacing: 2px; color: var(--text-dark); }
        
        /* HEADER */
        header { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 0; z-index: 1000; background-color: rgba(253, 252, 251, 0.95); box-shadow: 0 2px 15px rgba(0,0,0,0.05); backdrop-filter: blur(5px); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: var(--max-width); margin: 0 auto; padding: 0 20px; width: 100%; gap: 20px;}
        .nav-logo { font-size: 1.1rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dark); z-index: 1002; white-space: nowrap; }
        
        .nav-links { display: flex; gap: 25px; align-items: center; transition: all 0.3s ease;}
        .nav-links a { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dark); font-weight: 600; transition: color 0.3s; white-space: nowrap; }
        .nav-links a:hover { color: var(--box-peach-dark) !important; }
        
        .nav-actions { display: flex; align-items: center; gap: 15px; z-index: 1002; }
        .btn-book { background-color: var(--box-peach-dark); color: #fff !important; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap;}
        .btn-book:hover { background-color: var(--text-dark); transform: translateY(-1px); }

        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 6px; }
        .hamburger span { width: 25px; height: 2px; background-color: var(--text-dark); transition: 0.3s; }

        /* PAGE CONTENT */
        .page-header { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 130px 20px 70px; background-color: var(--bg-quote); text-align: center; }
.page-header h1 { font-size: 2.5rem; font-weight: 300; letter-spacing: 2px; color: var(--text-dark); margin: 0; }
        .section-pad { padding: 80px 0; text-align: center; min-height: 40vh;}
        
        footer { background-color: var(--bg-main); color: var(--text-gray); text-align: center; padding: 30px 20px; font-size: 0.85rem; border-top: 1px solid rgba(0,0,0,0.05); }

        /* RESPONSIVE */
        @media (max-width: 1050px) {
            .hamburger { display: flex; }
            .nav-links { position: fixed; top: 0; right: -100%; height: 100vh; width: 250px; background-color: var(--bg-main); flex-direction: column; justify-content: center; align-items: center; transition: right 0.3s ease; box-shadow: -2px 0 15px rgba(0,0,0,0.1); z-index: 1001; gap: 40px; }
            .nav-links.active { right: 0; }
            .nav-links a { font-size: 1.1rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <header class="solid-header">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Jackie Golding</a>
            
            <nav class="nav-links" id="nav-links">
                <a href="../">Home</a>
                <a href="about/">About</a>
                <a href="testimonials/">Testimonials</a>
                <a href="fees/">Fees & Availability</a>
                <a href="contact/">Contact</a>
            </nav>
            
            <div class="nav-actions">
                <a href="contact/" class="btn-book">Book Now</a>
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>CLIENT TESTIMONIALS</h1>
        </div>
    </div>

    <section class="section-pad">
        <div class="container">
            <p style="color: var(--text-gray); font-size: 1.1rem; font-style: italic;">
                Check back soon. Full testimonials page currently being updated.
            </p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Jackie Golding Therapy. All rights reserved. | <a href="privacy/" style="text-decoration: underline;">Privacy Policy</a></p>
        </div>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));
    </script>
</body>
</html>
