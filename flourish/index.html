<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>

  <!-- Instant redirect -->
  <meta http-equiv="refresh" content="0; url=https://alethara.com/#work" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    a {
      color: #4da3ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>

  <script>
    window.location.replace("https://alethara.com/#work");
  </script>
</head>
<body>
  <p>
    Redirecting...
    <br><br>
    If you're not redirected automatically,
    <a href="https://alethara.com/#work">click here</a>.
  </p>
</body>
</html>
